name: Feature branch validation

on:
  push:
    branches:
      - feat/group-chat-texture-sharing

permissions:
  contents: read

concurrency:
  group: feature-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-check:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Run scripts/check.ps1
        shell: pwsh
        run: ./scripts/check.ps1

  linux-check-and-build:
    name: Linux checks and viewer build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Rust toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup component add clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --profile ci --workspace --all-targets --locked -- -D warnings -A dead-code
      - name: Workspace tests
        run: cargo test --profile ci --workspace --locked
      - name: Build Linux viewer
        run: cargo build --release --locked -p aurora-viewer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Aurora-Viewer-linux-x64-${{ github.sha }}
          path: target/release/aurora-viewer
          if-no-files-found: error
          retention-days: 7

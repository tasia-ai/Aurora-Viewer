name: Rebase multiscreen PR 2975 onto latest Aurora
on:
  push:
    branches: [automation/upgrade-multiscreen-pr2975]
    paths: [.github/workflows/rebase-multiscreen-pr2975.yml]
permissions:
  contents: write
jobs:
  rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preview latest cherry-pick conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Tasia
          git config user.email tasia@easierit.org
          git remote add upstream https://github.com/Aurora-Viewer/Aurora-Viewer.git
          git fetch upstream main
          git fetch origin feat/native-multimonitor-floaters
          git checkout -B candidate/multiscreen-2975-latest upstream/main
          if git cherry-pick -x origin/feat/native-multimonitor-floaters; then
            echo 'No conflicts'
          else
            echo 'Conflict paths:'
            git diff --name-only --diff-filter=U
            for f in $(git diff --name-only --diff-filter=U); do
              echo "::group::$f"
              grep -n -A 35 -B 15 '^<<<<<<<' "$f" | head -c 30000 || true
              echo "::endgroup::"
            done
            exit 1
          fi

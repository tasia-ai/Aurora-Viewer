name: Rebase multiscreen PR 2975 onto latest Aurora
on:
  push:
    branches: [automation/upgrade-multiscreen-pr2975]
    paths: [.github/workflows/rebase-multiscreen-pr2975.yml]
permissions:
  contents: write
jobs:
  rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cherry-pick and preserve both widget behaviors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Tasia
          git config user.email tasia@easierit.org
          git remote add upstream https://github.com/Aurora-Viewer/Aurora-Viewer.git
          git fetch upstream main
          git fetch origin feat/native-multimonitor-floaters
          git checkout -B candidate/multiscreen-2975-latest upstream/main
          if ! git cherry-pick -x origin/feat/native-multimonitor-floaters; then
            python3 - <<'PY'
          from pathlib import Path
          import subprocess
          conflicts = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=U"], text=True).splitlines()
          expected = ["crates/aurora-viewer/src/ui/widgets.rs"]
          assert conflicts == expected, f"Unexpected conflicts: {conflicts}"
          path = Path(expected[0])
          src = path.read_text()
          old = """<<<<<<< HEAD
                      slot.shown(ctx, response.response.rect, minimized);
                      if self.headless && headless_close(ctx, p, window_id, &response.response, fill, opacity, self.order) {
                          close = true;
          =======
                      if let Some(slot) = slot.take() {
                          slot.shown(ctx, response.response.rect, minimized);
          >>>>>>> 01bb1b43 (feat(ui): native detachable floaters with multi-monitor recovery)
                      }
          """
          new = """            if let Some(slot) = slot.take() {
                          slot.shown(ctx, response.response.rect, minimized);
                      }
                      if self.headless && headless_close(ctx, p, window_id, &response.response, fill, opacity, self.order) {
                          close = true;
                      }
          """
          # YAML block indentation is stripped before execution; old/new string lines
          # above have identical indent in their template, matching Git's conflicted text.
          assert src.count(old) == 1, "Widget conflict no longer matches reviewed hunk"
          src = src.replace(old, new)
          assert "<<<<<<<" not in src and ">>>>>>>" not in src
          path.write_text(src)
          print("Merged optional layout slot and upstream headless-close behavior")
          PY
            git add crates/aurora-viewer/src/ui/widgets.rs
            git -c core.editor=true cherry-pick --continue
          fi
          git diff --check HEAD^ HEAD
          git show -s --format='PRE-BUILD CANDIDATE %H' HEAD
      - name: Install stable Rust and tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git add -u
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit --author='Tasia <tasia@easierit.org>'
          fi
          cargo fmt --all -- --check
          git diff --check HEAD^ HEAD
      - name: Publish validated equivalent rebased candidate
        shell: bash
        run: |
          set -euo pipefail
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          git show -s --format='Candidate %H | %an <%ae>' HEAD
          git push origin HEAD:refs/heads/candidate/multiscreen-2975-20261121-validated
